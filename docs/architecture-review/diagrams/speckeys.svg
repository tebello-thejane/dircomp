<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="speckeys-title speckeys-desc">
<title id="speckeys-title">Spec model: key strings built at seven call sites, then kept inside one module</title>
<desc id="speckeys-desc">Before and after: the parser, lookups, offer and walk each build or read the spec's key strings through four shared variables, then a single Spec module answers queries and keeps keys private.</desc>
