<text x="16" y="24" fill="#616161" font-size="8" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.18em">BEFORE</text>
<text x="536" y="24" fill="#616161" font-size="8" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.18em">AFTER</text>
<text x="256" y="168" fill="#2d2d3b" font-size="12" font-style="italic" font-family="'Roboto', system-ui, sans-serif">Only door in:</text>
<text x="256" y="184" fill="#2d2d3b" font-size="12" font-style="italic" font-family="'Roboto', system-ui, sans-serif">a real TAB.</text>
<text x="256" y="204" fill="#616161" font-size="8" font-family="'IBM Plex Mono', ui-monospace, monospace">about 1 s per case</text>
