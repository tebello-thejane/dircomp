<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="walkseam-title walkseam-desc">
<title id="walkseam-title">Completion walk: reachable only through a real TAB, then given its own seam</title>
<desc id="walkseam-desc">Before and after: every test of the walk and classify rules runs a pty, bash and bash-completion; afterwards table tests reach a Line reader module directly while the pty suite covers the host adapter.</desc>
<defs>
<marker id="walkseam-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#616161"/></marker>
<marker id="walkseam-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#da6a07"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f4f4"/>
