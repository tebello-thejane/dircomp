<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spec-howitworks-title spec-howitworks-desc">
<title id="spec-howitworks-title">dircomp: what happens on one TAB</title>
<desc id="spec-howitworks-desc">Three steps on pressing TAB after notes remote add web: find the spec file, walk the typed words through the nodes, then pick the section for the word under the cursor.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="spec-howitworks-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#616161"/></marker>
<marker id="spec-howitworks-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#da6a07"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<path d="M160 72 V128" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-howitworks-arrow)"/>
<path d="M280 170 H380" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-howitworks-arrow)"/>
<path d="M620 170 H720" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-howitworks-arrow)"/>
<path d="M840 212 V268" fill="none" stroke="#da6a07" stroke-width="1" marker-end="url(#spec-howitworks-arrow-accent)"/>
<rect x="40" y="32" width="240" height="40" rx="20" fill="#f4f4f4"/>
<rect x="40" y="32" width="240" height="40" rx="20" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="160.0" y="56.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">notes remote add web &lt;TAB&gt;</text>
<rect x="40" y="128" width="240" height="84" rx="6" fill="#f4f4f4"/>
<rect x="40" y="128" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="160.0" y="156.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">1  Find the spec</text>
<text x="160.0" y="172.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">notes is a file on disk;</text>
<text x="160.0" y="184.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">read .completions/notes</text>
<text x="160.0" y="196.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">next to it, or above</text>
<rect x="380" y="128" width="240" height="84" rx="6" fill="#f4f4f4"/>
<rect x="380" y="128" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="500.0" y="156.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">2  Walk the typed words</text>
<text x="500.0" y="172.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">remote : node [remote]</text>
<text x="500.0" y="184.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">add    : node [remote add]</text>
<text x="500.0" y="196.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">web    : positional 1</text>
<rect x="720" y="128" width="240" height="84" rx="6" fill="#f4f4f4"/>
<rect x="720" y="128" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="840.0" y="156.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">3  Look at the cursor</text>
<text x="840.0" y="172.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">a non-flag word, and</text>
<text x="840.0" y="184.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">a slot exists for it:</text>
<text x="840.0" y="196.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">positional 2</text>
<rect x="720" y="268" width="240" height="52" rx="6" fill="#f4f4f4"/>
<rect x="720" y="268" width="240" height="52" rx="6" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="840.0" y="292.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[remote add #2]</text>
<text x="840.0" y="308.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">offers @host: hostnames</text>
<line x1="32" y1="336" x2="968" y2="336" stroke="#2d2d3b" stroke-opacity="0.12" stroke-width="0.8"/>
<text x="32" y="356" fill="#616161" font-size="8" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="350" width="16" height="12" rx="3" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="144" y="360" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">the section TAB reads</text>
<rect x="340" y="350" width="16" height="12" rx="3" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="364" y="360" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">step</text>
</svg>
