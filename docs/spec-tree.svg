<rect x="380" y="140" width="160" height="52" rx="6" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="460.0" y="164.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[run]</text>
<text x="460.0" y="180.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">@endopts  --name -p -t</text>
<rect x="780" y="140" width="160" height="52" rx="6" fill="#f4f4f4"/>
<rect x="780" y="140" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="860.0" y="164.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[rm]</text>
<text x="860.0" y="180.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">-f</text>
