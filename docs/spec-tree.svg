<text x="460.0" y="80.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">run rm ps --help</text>
<rect x="40" y="140" width="160" height="52" rx="6" fill="#f4f4f4"/>
<rect x="40" y="140" width="160" height="52" rx="6" fill="#2d2d3b" fill-opacity="0.02" stroke="#2d2d3b" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
<text x="120.0" y="164.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[*]</text>
<text x="120.0" y="180.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">merged into every node</text>
