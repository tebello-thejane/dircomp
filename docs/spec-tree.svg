<rect x="200" y="240" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="0.8"/>
<text x="280.0" y="264.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[run --restart]</text>
<text x="280.0" y="280.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">no always on-failure</text>
