<text x="32" y="344" fill="#616161" font-size="8" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="338" width="16" height="12" rx="3" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="144" y="348" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">directive: flags end at the first positional</text>
<rect x="424" y="338" width="16" height="12" rx="3" fill="#2d2d3b" fill-opacity="0.02" stroke="#2d2d3b" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
<text x="448" y="348" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">merged into every node</text>
<rect x="624" y="338" width="16" height="12" rx="3" fill="#ffffff" stroke="#2d2d3b" stroke-width="0.8"/>
<text x="648" y="348" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">leaf: flag values or a positional slot</text>
</svg>
