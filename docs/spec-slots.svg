<rect x="750" y="48" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="850.0" y="74.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">&lt;TAB&gt;</text>
<text x="850.0" y="90.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">word at cursor</text>
<rect x="30" y="176" width="200" height="76" rx="6" fill="#f4f4f4"/>
<rect x="30" y="176" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="130.0" y="206.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">descend</text>
