<text x="370.0" y="90.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">typed word</text>
<rect x="510" y="48" width="200" height="56" rx="6" fill="#f4f4f4"/>
<rect x="510" y="48" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="610.0" y="74.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">web</text>
<text x="610.0" y="90.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">typed word</text>
