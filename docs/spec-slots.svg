<path d="M470 76 H510" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-slots-arrow)"/>
<path d="M710 76 H750" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-slots-arrow)"/>
<path d="M130 104 V176" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-slots-arrow)"/>
