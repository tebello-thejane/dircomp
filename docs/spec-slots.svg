<rect x="510" y="176" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="610.0" y="206.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">positional 1</text>
<text x="610.0" y="222.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">P = [remote add]</text>
<text x="610.0" y="234.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">k = 1</text>
<rect x="750" y="176" width="200" height="76" rx="6" fill="#f4f4f4"/>
<rect x="750" y="176" width="200" height="76" rx="6" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="850.0" y="206.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">cursor: slot #2</text>
<text x="850.0" y="222.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">[remote add #2]</text>
<text x="850.0" y="234.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">k + 1 = 2</text>
