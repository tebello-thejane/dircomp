<path d="M850 104 V176" fill="none" stroke="#616161" stroke-width="1" marker-end="url(#spec-slots-arrow)"/>
<rect x="30" y="48" width="200" height="56" rx="6" fill="#f4f4f4"/>
<rect x="30" y="48" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="130.0" y="74.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">remote</text>
<text x="130.0" y="90.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">typed word</text>
