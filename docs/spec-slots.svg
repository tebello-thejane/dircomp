<rect x="270" y="176" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="370.0" y="206.0" fill="#2d2d3b" font-size="12" font-weight="500" font-family="'Roboto', system-ui, sans-serif" text-anchor="middle">descend</text>
<text x="370.0" y="222.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">P = [remote add]</text>
<text x="370.0" y="234.0" fill="#616161" font-size="9" font-weight="400" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">k = 0</text>
