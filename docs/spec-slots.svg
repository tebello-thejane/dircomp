<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spec-slots-title spec-slots-desc">
<title id="spec-slots-title">dircomp: counting positional arguments</title>
<desc id="spec-slots-desc">Reading notes remote add web TAB left to right: remote and add descend into nodes, web is positional 1, so the cursor is on slot 2 of the remote add node.</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="spec-slots-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#616161"/></marker>
<marker id="spec-slots-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#da6a07"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f4f4"/>
