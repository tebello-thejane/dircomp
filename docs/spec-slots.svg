<text x="32" y="288" fill="#616161" font-size="8" font-weight="500" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text>
<rect x="120" y="282" width="16" height="12" rx="3" fill="#da6a07" fill-opacity="0.08" stroke="#da6a07" stroke-width="1"/>
<text x="144" y="292" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">the section TAB reads</text>
<rect x="340" y="282" width="16" height="12" rx="3" fill="#ffffff" stroke="#2d2d3b" stroke-width="1"/>
<text x="364" y="292" fill="#616161" font-size="9" font-weight="400" font-family="'Roboto', system-ui, sans-serif" text-anchor="start">step</text>
</svg>
